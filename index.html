function makeGM(){
  const ms=[];
  const mu=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  const sd=[11,17,23];
  Object.keys(GROUPS).forEach((g,gi)=>{
    const teams=GROUPS[g],dib=Math.floor(gi/2),sl=gi%2;
    mu.forEach((pairs,ri)=>{
      const bd=sd[ri]+dib,hrs=sl===0?[13,16]:[19,22];
      pairs.forEach(([a,b],mi)=>{
        const d=new Date(2026,5,bd,hrs[mi],0,0);
        ms.push({id:`${g}R${ri+1}M${mi+1}`,stage:"group",group:g,round:ri+1,
          h:teams[a],a:teams[b],k:d.toISOString(),label:`Grupo ${g} · J${ri+1}`});
      });
    });
  });
  return ms;
}

function mw(mid,results,allKO){
  const m=allKO.find(x=>x.id===mid);
  if(!m)return"⏳";
  const res=results[mid];
  if(!res||res.home===undefined||res.away===undefined)return`⏳ ${m.h} vs ${m.a}`;
  if(res.home>res.away)return m.h;
  if(res.away>res.home)return m.a;
  if(res.pw==="home")return m.h;
  if(res.pw==="away")return m.a;
  return`⏳ penaltis`;
}

function getTeam(m,side,results){
  const val=m[side];
  if(typeof val==="string")return val;
  const mid=m[side==="h"?"hm":"am"];
  if(!mid)return"⏳";
  const src=KO.find(x=>x.id===mid);
  if(!src)return"⏳";
  const res=results[mid];
  if(!res||res.home===undefined||res.away===undefined)return`⏳`;
  const srcH=typeof src.h==="string"?src.h:getTeam(src,"h",results);
  const srcA=typeof src.a==="string"?src.a:getTeam(src,"a",results);
  let winner,loser;
  if(res.home>res.away){winner=srcH;loser=srcA;}
  else if(res.away>res.home){winner=srcA;loser=srcH;}
  else if(res.pw==="home"){winner=srcH;loser=srcA;}
  else if(res.pw==="away"){winner=srcA;loser=srcH;}
  else return"⏳ penaltis";
  return m.isLoser?loser:winner;
}

function getH(m,results){return getTeam(m,"h",results);}
function getA(m,results){return getTeam(m,"a",results);}

function calcPts(pred,res){
  if(!pred||!res||res.home===undefined||res.away===undefined)return 0;
  const ph=parseInt(pred.home),pa=parseInt(pred.away);
  if(isNaN(ph)||isNaN(pa))return 0;
  if(ph===res.home&&pa===res.away)return 5;
  const po=ph>pa?"H":ph<pa?"A":"D",ro=res.home>res.away?"H":res.home<res.away?"A":"D";
  return po===ro?2:0;
}

function calcStandings(g,results){
  const teams=GROUPS[g];
  const st=teams.map(t=>({team:t,pts:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,played:0}));
  GM.filter(m=>m.group===g&&results[m.id]&&results[m.id].home!==undefined).forEach(m=>{
    const res=results[m.id];
    const hs=st.find(s=>s.team===m.h),as=st.find(s=>s.team===m.a);
    if(!hs||!as)return;
    hs.played++;as.played++;hs.gf+=res.home;hs.ga+=res.away;as.gf+=res.away;as.ga+=res.home;
    hs.gd=hs.gf-hs.ga;as.gd=as.gf-as.ga;
    if(res.home>res.away){hs.pts+=3;hs.w++;as.l++;}
    else if(res.home<res.away){as.pts+=3;as.w++;hs.l++;}
    else{hs.pts+=1;hs.d++;as.pts+=1;as.d++;}
  });
  return st.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function compressImg(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas");
      const s=Math.min(1,500/img.width);c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.65));URL.revokeObjectURL(url);
    };img.src=url;
  });
}

  const showToast=msg=>{setToast({msg,show:true});setTimeout(()=>setToast(t=>({...t,show:false})),2800);};

function IGView({data}){
  const canvasRef=useRef();
  const[gen,setGen]=useState(null);
  const generate=()=>{
    const c=canvasRef.current,ctx=c.getContext("2d");
    c.width=1080;c.height=1080;
    ctx.fillStyle="#1a0b06";ctx.fillRect(0,0,1080,1080);
    const g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,"#26120c");g.addColorStop(1,"#0d0604");
    ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,0,1080,8);
    ctx.fillStyle="#ff5b21";ctx.font="bold 48px Arial";ctx.textAlign="center";ctx.fillText("RICHIE TORTAS",540,74);
    ctx.fillStyle="#ffffff99";ctx.font="26px Arial";ctx.fillText("🏆 RANKING QUINIELA MUNDIAL 2026",540,116);
    ctx.fillStyle="#ff5b2188";ctx.font="20px Arial";ctx.fillText(new Date().toLocaleDateString("es-VE",{day:"2-digit",month:"long",year:"numeric"}),540,152);
    ctx.strokeStyle="#ff5b2140";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,168);ctx.lineTo(1000,168);ctx.stroke();
    const parts=Object.values(data.participants||{}).filter(p=>p.status==="approved");
    const ranked=parts.map(p=>{
      let pts=0;const pr=data.predictions&&data.predictions[p.id]||{};
      [...GM,...KO].forEach(m=>{const res=data.results&&data.results[m.id],pred=pr[m.id];if(res&&pred)pts+=calcPts(pred,res);});
      return{...p,pts};
    }).sort((a,b)=>b.pts-a.pts).slice(0,10);
    const medals=["🥇","🥈","🥉"];
    ranked.forEach((p,i)=>{
      const y=188+i*80;
      ctx.fillStyle=i===0?"#ff5b2112":"#ffffff05";
      ctx.beginPath();ctx.roundRect?ctx.roundRect(58,y,964,68,7):ctx.rect(58,y,964,68);ctx.fill();
      ctx.font="28px Arial";ctx.textAlign="left";
      if(i<3)ctx.fillText(medals[i],76,y+43);
      else{ctx.fillStyle="#a07060";ctx.font="bold 22px Arial";ctx.fillText("#"+(i+1),78,y+42);}
      ctx.fillStyle="#f5f5f0";ctx.font="bold 25px Arial";ctx.textAlign="left";
      ctx.fillText(p.name.toUpperCase().substring(0,30),136,y+42);
      ctx.fillStyle="#ff5b21";ctx.font="bold 28px Arial";ctx.textAlign="right";
      ctx.fillText(p.pts+" pts",1004,y+42);
    });
    if(!ranked.length){ctx.fillStyle="#a07060";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText("¡El ranking aparece aquí!",540,500);}
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,1072,1080,8);
    ctx.fillStyle="#a07060";ctx.font="19px Arial";ctx.textAlign="center";
    ctx.fillText("Compra en Richie Tortas · Quiniela Mundial 2026",540,1046);
    setGen(c.toDataURL("image/png"));
  };
  const dl=()=>{const a=document.createElement("a");a.href=gen;a.download="ranking-richie-"+new Date().toISOString().slice(0,10)+".png";a.click();};
  return React.createElement(React.Fragment,null,
    React.createElement("div",{className:"sh"},"📸 Imagen para Instagram"),
    React.createElement("div",{className:"card"},
      React.createElement("p",{style:{color:"var(--mu)",fontSize:".78rem",marginBottom:13,lineHeight:1.7}},"Genera una imagen 1080×1080 del ranking para Instagram."),
      React.createElement("button",{className:"btn bo",onClick:generate,style:{marginBottom:13}},"🎨 Generar Imagen"),
      gen&&React.createElement("div",null,
        React.createElement("img",{src:gen,alt:"ranking",style:{width:"100%",borderRadius:8,marginBottom:10,border:"1px solid var(--bd)"}}),
        React.createElement("button",{className:"btn bg",onClick:dl},"⬇️ Descargar PNG")
      ),
      React.createElement("canvas",{ref:canvasRef,style:{display:"none"}})
    )
  );
}
