// ─── TABLA DE POSICIONES ─────────────────────────────────────────
function calcStandings(g,allMatches,results){
  const teams=GROUPS[g];
  const st=teams.map(t=>({team:t,pts:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,played:0}));
  allMatches.filter(m=>m.group===g&&results[m.id]).forEach(m=>{
    const res=results[m.id];
    if(res.home===undefined||res.away===undefined)return;
    const h=st.find(s=>s.team===m.home),a=st.find(s=>s.team===m.away);
    if(!h||!a)return;
    h.played++;a.played++;h.gf+=res.home;h.ga+=res.away;a.gf+=res.away;a.ga+=res.home;
    h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;
    if(res.home>res.away){h.pts+=3;h.w++;a.l++;}
    else if(res.home<res.away){a.pts+=3;a.w++;h.l++;}
    else{h.pts+=1;h.d++;a.pts+=1;a.d++;}
  });
  return st.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function getBest3rd(groupMatches,results){
  return Object.keys(GROUPS).map(g=>{
    const played=groupMatches.filter(m=>m.group===g&&results[m.id]).length;
    if(played<6)return null;
    return{group:g,...calcStandings(g,groupMatches,results)[2]};
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8);
}

// ─── GENERAR PARTIDOS FASE DE GRUPOS ─────────────────────────────
function generateGroupMatches(){
  const ms=[];
  const glts=Object.keys(GROUPS);
  const matchups=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  const startDays=[11,17,23];
  glts.forEach((g,gi)=>{
    const teams=GROUPS[g];
    const dayInBlock=Math.floor(gi/2),slot=gi%2;
    matchups.forEach((pairs,ri)=>{
      const baseDay=startDays[ri]+dayInBlock;
      const hours=slot===0?[13,16]:[19,22];
      pairs.forEach(([a,b],mi)=>{
        const d=new Date(2026,5,baseDay,hours[mi],0,0);
        ms.push({id:`${g}R${ri+1}M${mi+1}`,stage:"group",group:g,round:ri+1,
          home:teams[a],away:teams[b],kickoff:d.toISOString(),
          label:`Grupo ${g} · Jornada ${ri+1}`,fase:1});
      });
    });
  });
  return ms;
}

// ─── RESOLVER EQUIPO ─────────────────────────────────────────────
function resolveTeam(slot,results,koMatches){
  if(!slot)return"⏳";
  if(typeof slot==="string")return slot;
  const{t,g,gs,mid}=slot;
  if(t==="winner"&&g){
    const played=GROUP_MATCHES.filter(m=>m.group===g&&results[m.id]).length;
    if(played<6)return`1º Grupo ${g}`;
    return calcStandings(g,GROUP_MATCHES,results)[0]?.team||`1º Grupo ${g}`;
  }
  if(t==="runner"&&g){
    const played=GROUP_MATCHES.filter(m=>m.group===g&&results[m.id]).length;
    if(played<6)return`2º Grupo ${g}`;
    return calcStandings(g,GROUP_MATCHES,results)[1]?.team||`2º Grupo ${g}`;
  }
  if(t==="best3"&&gs){
    const allDone=gs.every(grp=>GROUP_MATCHES.filter(m=>m.group===grp&&results[m.id]).length>=6);
    if(!allDone)return`Mejor 3º (${gs.join("/")})`;
    const best8=getBest3rd(GROUP_MATCHES,results);
    const candidate=best8.find(x=>gs.includes(x.group));
    return candidate?candidate.team:`Mejor 3º (${gs.join("/")})`;
  }
  if((t==="mw"||t==="ml")&&mid){
    const match=koMatches.find(m=>m.id===mid);
    if(!match)return"⏳";
    const res=results[mid];
    const hT=resolveTeam(match.home,results,koMatches);
    const aT=resolveTeam(match.away,results,koMatches);
    if(!res||res.home===undefined||res.away===undefined)
      return`⏳ ${match.label.split("·")[1]?.trim()||"?"}`;
    const hWin=res.home>res.away||(res.home===res.away&&res.pw==="home");
    if(t==="mw")return hWin?hT:aT;
    if(t==="ml")return hWin?aT:hT;
  }
  return"⏳";
}

// ─── SCORING ─────────────────────────────────────────────────────
function calcPts(pred,res){
  if(!pred||!res||res.home===undefined||res.away===undefined)return 0;
  const ph=parseInt(pred.home),pa=parseInt(pred.away);
  if(isNaN(ph)||isNaN(pa))return 0;
  if(ph===res.home&&pa===res.away)return 5;
  const po=ph>pa?"H":ph<pa?"A":"D",ro=res.home>res.away?"H":res.home<res.away?"A":"D";
  return po===ro?2:0;
}

function calcRanking(participants,predictions,results){
  return participants.filter(p=>p.status==="approved").map(p=>{
    let f1pts=0,f2pts=0,exact=0,outcome=0;
    const preds=predictions[p.id]||{};
    GROUP_MATCHES.forEach(m=>{const r=results[m.id],pr=preds[m.id];if(r&&pr){const pp=calcPts(pr,r);f1pts+=pp;if(pp===5)exact++;else if(pp===2)outcome++;}});
    KO_MATCHES.forEach(m=>{const r=results[m.id],pr=preds[m.id];if(r&&pr){const pp=calcPts(pr,r);f2pts+=pp;if(pp===5)exact++;else if(pp===2)outcome++;}});
    return{...p,f1pts,f2pts,pts:f1pts+f2pts,exact,outcome};
  }).sort((a,b)=>b.pts-a.pts);
}

function loadData(){
  try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(_){}
  return{participants:[],results:{},predictions:{},fase2abierta:false};
}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(_){}}

};

function compressImage(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas");
      const s=Math.min(1,700/img.width);c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.72));URL.revokeObjectURL(url);
    };img.src=url;
  });
}

// ─── INSTAGRAM ────────────────────────────────────────────────────
function InstagramView({data}){
  const canvasRef=useRef();
  const[gen,setGen]=useState(null);

  const generate=()=>{
    const c=canvasRef.current,ctx=c.getContext("2d");
    c.width=1080;c.height=1080;
    ctx.fillStyle="#1a0b06";ctx.fillRect(0,0,1080,1080);
    const g=ctx.createLinearGradient(0,0,1080,1080);
    g.addColorStop(0,"#26120c");g.addColorStop(1,"#0d0604");
    ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,0,1080,8);
    ctx.fillStyle="#ff5b21";ctx.font="bold 50px Arial";ctx.textAlign="center";ctx.fillText("RICHIE TORTAS",540,76);
    ctx.fillStyle="#ffffff99";ctx.font="27px Arial";ctx.fillText("🏆 RANKING QUINIELA MUNDIAL 2026",540,118);
    const now=new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
    ctx.fillStyle="#ff5b2188";ctx.font="21px Arial";ctx.fillText(now,540,155);
    ctx.strokeStyle="#ff5b2140";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,172);ctx.lineTo(1000,172);ctx.stroke();

    const ranked=calcRanking(data.participants,data.predictions,data.results).slice(0,10);
    const medals=["🥇","🥈","🥉"];
    ranked.forEach((p,i)=>{
      const y=192+i*80;
      ctx.fillStyle=i===0?"#ff5b2112":"#ffffff05";
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(58,y,964,68,7);else ctx.rect(58,y,964,68);ctx.fill();
      ctx.font="30px Arial";ctx.textAlign="left";
      if(i<3)ctx.fillText(medals[i],76,y+43);
      else{ctx.fillStyle="#a07060";ctx.font="bold 23px Arial";ctx.fillText(`#${i+1}`,78,y+42);}
      ctx.fillStyle="#f5f5f0";ctx.font="bold 26px Arial";ctx.textAlign="left";
      ctx.fillText(p.name.toUpperCase().substring(0,30),138,y+42);
      ctx.fillStyle="#ff5b21";ctx.font="bold 30px Arial";ctx.textAlign="right";
      ctx.fillText(`${p.pts} pts`,1004,y+42);
      if(p.f2pts>0){ctx.fillStyle="#ffffff40";ctx.font="18px Arial";ctx.textAlign="right";ctx.fillText(`(${p.f1pts}+${p.f2pts})`,1004,y+62);}
    });
    if(ranked.length===0){ctx.fillStyle="#a07060";ctx.font="24px Arial";ctx.textAlign="center";ctx.fillText("¡El ranking aparece aquí!",540,500);}
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,1072,1080,8);
    ctx.fillStyle="#a07060";ctx.font="20px Arial";ctx.textAlign="center";
    ctx.fillText("Compra en Richie Tortas · 4 al 11 de Junio · ¡Participa!",540,1048);
    setGen(c.toDataURL("image/png"));
  };
  const download=()=>{const a=document.createElement("a");a.href=gen;a.download=`ranking-richie-${new Date().toISOString().slice(0,10)}.png`;a.click();};

  return React.createElement(React.Fragment,null,
    React.createElement("div",{className:"sh"},"📸 Imagen para Instagram"),
    React.createElement("div",{className:"card"},
      React.createElement("p",{style:{color:"var(--muted)",fontSize:".8rem",marginBottom:14,lineHeight:1.7}},"Genera una imagen 1080×1080 del ranking para Instagram. Los puntos muestran el desglose fase grupos + eliminatorias."),
      React.createElement("button",{className:"btn btn-o",onClick:generate,style:{marginBottom:14}},"🎨 Generar Imagen"),
      gen&&React.createElement("div",null,
        React.createElement("img",{src:gen,alt:"ranking",style:{width:"100%",borderRadius:9,marginBottom:11,border:"1px solid var(--border)"}}),
        React.createElement("button",{className:"btn btn-g",onClick:download},"⬇️ Descargar PNG")
      ),
      React.createElement("canvas",{ref:canvasRef,style:{display:"none"}})
    )
  );
}
