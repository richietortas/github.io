// ─── FIREBASE REST (sin SDK) ─────────────────────────────────────
function getDB(){return localStorage.getItem(LS_FB)||FB_HARDCODED;}
async function fbRead(path){
  try{const r=await fetch(`${getDB()}/${path}.json`);const d=await r.json();return d||{};}catch(_){return{};}
}
async function fbWrite(path,data){
  try{await fetch(`${getDB()}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});}catch(_){}
}
async function fbPatch(path,data){
  try{await fetch(`${getDB()}/${path}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});}catch(_){}
}
async function fbDelete(path){
  try{await fetch(`${getDB()}/${path}.json`,{method:"DELETE"});}catch(_){}
}

// ─── CLASIFICACIÓN ───────────────────────────────────────────────
function standings(g,results){
  const teams=GROUPS[g];
  const st=teams.map(t=>({team:t,pts:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,played:0}));
  GM.filter(m=>m.g===g&&results[m.id]&&results[m.id].home!==undefined).forEach(m=>{
    const res=results[m.id];
    const hS=st.find(s=>s.team===m.h),aS=st.find(s=>s.team===m.a);
    if(!hS||!aS)return;
    hS.played++;aS.played++;hS.gf+=res.home;hS.ga+=res.away;
    aS.gf+=res.away;aS.ga+=res.home;hS.gd=hS.gf-hS.ga;aS.gd=aS.gf-aS.ga;
    if(res.home>res.away){hS.pts+=3;hS.w++;aS.l++;}
    else if(res.home<res.away){aS.pts+=3;aS.w++;hS.l++;}
    else{hS.pts+=1;hS.d++;aS.pts+=1;aS.d++;}
  });
  return st.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function best3rd(results){
  return Object.keys(GROUPS).map(g=>{
    const played=GM.filter(m=>m.g===g&&results[m.id]&&results[m.id].home!==undefined).length;
    if(played<6)return null;
    return{group:g,...standings(g,results)[2]};
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).slice(0,8);
}
function resolveTeam(slot,results){
  if(!slot||typeof slot==="string")return slot||"⏳";
  const{t,g,gs,mid}=slot;
  if(t==="winner"&&g){const pl=GM.filter(m=>m.g===g&&results[m.id]).length;return pl<6?`1º Grupo ${g}`:standings(g,results)[0]?.team||`1º ${g}`;}
  if(t==="runner"&&g){const pl=GM.filter(m=>m.g===g&&results[m.id]).length;return pl<6?`2º Grupo ${g}`:standings(g,results)[1]?.team||`2º ${g}`;}
  if(t==="best3"&&gs){
    const allDone=gs.every(grp=>GM.filter(m=>m.g===grp&&results[m.id]).length>=6);
    if(!allDone)return`Mejor 3º (${gs.join("/")})`;
    const b8=best3rd(results);
    const used=new Set();
    // assign greedily by rank
    let candidate=b8.find(x=>gs.includes(x.group)&&!used.has(x.group));
    return candidate?candidate.team:`Mejor 3º (${gs.join("/")})`;
  }
  if((t==="mw"||t==="ml")&&mid){
    const match=KO.find(m=>m.id===mid);
    if(!match)return"⏳";
    const res=results[mid];
    const hT=resolveTeam(match.h,results),aT=resolveTeam(match.a,results);
    if(!res||res.home===undefined||res.away===undefined)return`⏳ ${match.label.split("·")[1]?.trim()||"?"}`;
    const hW=res.home>res.away||(res.home===res.away&&res.pw==="home");
    return t==="mw"?(hW?hT:aT):(hW?aT:hT);
  }
  return"⏳";
}
function calcPts(pred,res){
  if(!pred||!res||res.home===undefined||res.away===undefined)return 0;
  const ph=parseInt(pred.home),pa=parseInt(pred.away);
  if(isNaN(ph)||isNaN(pa))return 0;
  if(ph===res.home&&pa===res.away)return 5;
  const po=ph>pa?"H":ph<pa?"A":"D",ro=res.home>res.away?"H":res.home<res.away?"A":"D";
  return po===ro?2:0;
}
const fmtD=iso=>{try{const d=new Date(iso);return d.toLocaleDateString("es-VE",{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es-VE",{hour:"2-digit",minute:"2-digit"})+" VET";}catch(_){return iso;}};
const locked=k=>{try{return new Date()>=new Date(k);}catch(_){return false;}};

function compressImg(file){
  return new Promise(r=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas");
      const s=Math.min(1,500/img.width);c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      r(c.toDataURL("image/jpeg",.65));URL.revokeObjectURL(url);
    };img.src=url;
  });
}

// ─── INSTAGRAM ───────────────────────────────────────────────────
function IGView({data}){
  const canvasRef=useRef();
  const[gen,setGen]=useState(null);
  const generate=()=>{
    const c=canvasRef.current,ctx=c.getContext("2d");
    c.width=1080;c.height=1080;
    ctx.fillStyle="#1a0b06";ctx.fillRect(0,0,1080,1080);
    const g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,"#26120c");g.addColorStop(1,"#0d0604");
    ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,0,1080,8);
    ctx.fillStyle="#ff5b21";ctx.font="bold 48px Arial";ctx.textAlign="center";ctx.fillText("RICHIE TORTAS",540,74);
    ctx.fillStyle="#ffffff99";ctx.font="26px Arial";ctx.fillText("🏆 RANKING QUINIELA MUNDIAL 2026",540,116);
    ctx.fillStyle="#ff5b2188";ctx.font="20px Arial";ctx.fillText(new Date().toLocaleDateString("es-VE",{day:"2-digit",month:"long",year:"numeric"}),540,152);
    ctx.strokeStyle="#ff5b2140";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,168);ctx.lineTo(1000,168);ctx.stroke();
    const parts=Object.values(data.participants||{}).filter(p=>p.status==="approved");
    const ranked=parts.map(p=>{let pts=0;const pr=data.predictions?.[p.id]||{};ALL.forEach(m=>{const res=data.results?.[m.id],pred=pr[m.id];if(res&&pred)pts+=calcPts(pred,res);});return{...p,pts};}).sort((a,b)=>b.pts-a.pts).slice(0,10);
    const medals=["🥇","🥈","🥉"];
    ranked.forEach((p,i)=>{
      const y=188+i*78;
      ctx.fillStyle=i===0?"#ff5b2112":"#ffffff05";
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(58,y,964,66,7);else ctx.rect(58,y,964,66);ctx.fill();
      ctx.font="28px Arial";ctx.textAlign="left";
      if(i<3)ctx.fillText(medals[i],76,y+42);
      else{ctx.fillStyle="#a07060";ctx.font="bold 22px Arial";ctx.fillText(`#${i+1}`,78,y+41);}
      ctx.fillStyle="#f5f5f0";ctx.font="bold 25px Arial";ctx.textAlign="left";
      ctx.fillText(p.name.toUpperCase().substring(0,30),136,y+41);
      ctx.fillStyle="#ff5b21";ctx.font="bold 28px Arial";ctx.textAlign="right";
      ctx.fillText(`${p.pts} pts`,1004,y+41);
    });
    if(!ranked.length){ctx.fillStyle="#a07060";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText("¡El ranking aparece aquí!",540,500);}
    ctx.fillStyle="#ff5b21";ctx.fillRect(0,1072,1080,8);
    ctx.fillStyle="#a07060";ctx.font="19px Arial";ctx.textAlign="center";
    ctx.fillText("Compra en Richie Tortas · 4 al 11 de Junio · Todos los horarios en hora Venezuela",540,1046);
    setGen(c.toDataURL("image/png"));
  };
  const dl=()=>{const a=document.createElement("a");a.href=gen;a.download=`ranking-richie-${new Date().toISOString().slice(0,10)}.png`;a.click();};
  return React.createElement(React.Fragment,null,
    React.createElement("div",{className:"sh"},"📸 Imagen para Instagram"),
    React.createElement("div",{className:"card"},
      React.createElement("p",{style:{color:"var(--mu)",fontSize:".78rem",marginBottom:13,lineHeight:1.7}},"Genera una imagen 1080×1080 del ranking para Instagram."),
      React.createElement("button",{className:"btn bo",onClick:generate,style:{marginBottom:13}},"🎨 Generar Imagen"),
      gen&&React.createElement("div",null,
        React.createElement("img",{src:gen,alt:"ranking",style:{width:"100%",borderRadius:8,marginBottom:10,border:"1px solid var(--bd)"}}),
        React.createElement("button",{className:"btn bg",onClick:dl},"⬇️ Descargar PNG")
      ),
      React.createElement("canvas",{ref:canvasRef,style:{display:"none"}})
    )
  );
}
